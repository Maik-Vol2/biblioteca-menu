<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ejemplo - Biblioteca de Menú</title>


    <!-- =========================================
         CSS DE NUESTRA BIBLIOTECA
         ========================================= -->

    <link
        rel="stylesheet"
        href="../menu.css"
    >

</head>


<body>


    <!-- =========================================
         CONTENEDOR DEL MENÚ
         ========================================= -->

    <div id="mi-menu"></div>



    <!-- =========================================
         CARGAR NUESTRA BIBLIOTECA
         ========================================= -->

    <script src="../menu.js"></script>



    <!-- =========================================
         CONFIGURACIÓN DEL CONSUMIDOR
         ========================================= -->

    <script>

        crearMenu({

            nombre: "Mi tienda",

            colorFondo: "#006633",

             colorTexto: "#FFFFFF",

             colorHover: "#FFFF00",

            opciones: [

                {
                    nombre: "Inicio",
                    ruta: "/"
                },

                {
                    nombre: "Productos",
                    ruta: "/productos"
                },

                {
                    nombre: "Ofertas",
                    ruta: "/ofertas"
                },

                {
                    nombre: "Contacto",
                    ruta: "/contacto"
                }

            ]

        });

    </script>


</body>

</html>
